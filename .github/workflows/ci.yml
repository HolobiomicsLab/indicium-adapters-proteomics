name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # indicium and indicium-adapters aren't on PyPI yet; both install from
          # their public repositories, so no token is needed. The pins move to
          # PyPI once indicium-standard 2.0.0 and indicium-adapters 0.6.0 are published.
          pip install "indicium-standard @ git+https://github.com/HolobiomicsLab/indicium@500dd828369fd0431154456cb1debfdfcaef779d"
          pip install "indicium-adapters @ git+https://github.com/HolobiomicsLab/indicium-adapters@9e274c2"
          pip install -e .[dev]
      - name: Lint
        run: ruff check .
      - name: Run tests
        run: pytest --cov=indicium_adapters_proteomics --cov-report=term-missing
