name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Configure git auth for the private indicium-adapters install
        env:
          GH_TOKEN: ${{ secrets.ORG_PAT }}
        run: |
          # indicium is public; only indicium-adapters is still private.
          # Scope the PAT rewrite to that one repo so public clones stay anonymous.
          # Requires repo secret ORG_PAT with Contents: Read on HolobiomicsLab/indicium-adapters.
          git config --global url."https://x-access-token:${GH_TOKEN}@github.com/HolobiomicsLab/indicium-adapters".insteadOf "https://github.com/HolobiomicsLab/indicium-adapters"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # indicium and indicium-adapters aren't on PyPI yet; install from git
          # Pin moves to PyPI once indicium-standard 2.0.0 is published.
          pip install "indicium-standard @ git+https://github.com/HolobiomicsLab/indicium@500dd828369fd0431154456cb1debfdfcaef779d"
          pip install git+https://github.com/HolobiomicsLab/indicium-adapters.git@main
          pip install -e .[dev]
      - name: Lint
        run: ruff check .
      - name: Run tests
        run: pytest --cov=indicium_adapters_proteomics --cov-report=term-missing
